# Helm Hydration
#
# This is the complete, production-ready Helm hydration pipeline. It combines
# all building blocks: it discovers the charts in the repository, reads the
# environments of each chart from its `helm-config.yaml`, installs Helm,
# installs the chart dependencies pinned in `Chart.lock`, renders
# environment-specific Kubernetes manifests using `helm template`, and opens a
# version-aware pull request per chart and environment whose manifests changed.
# Optionally, patch-level subchart updates are bundled into a single PR by
# replacing the patch segment of the version with "x".
#
# Purpose
# -------
# Instead of hard-coding environment names (e.g. dev, staging, prod) inside
# the workflow, they are read at runtime from `helm-config.yaml`. Every chart
# and environment is rendered into a fully hydrated set of manifests ready for
# GitOps consumption.
#
# Job layout
# ----------
# All charts and environments are rendered by one job. Rendering a pair takes
# seconds, while a job of its own costs a checkout, a Helm installation and a
# dependency build, and is billed by the started minute. A repository holding
# ten charts with three environments each would otherwise start thirty jobs on
# every push.
#
# Only the pairs whose rendered manifests differ from what the environment
# branch, or the open pull request for it, already holds fan out into a
# pull-request job. A push that changes one chart therefore opens pull requests
# for that chart only, and a push that changes no manifest at all starts no
# pull-request job.
#
# Expected repository layout
# --------------------------
# Every directory containing a `helm-config.yaml` is treated as a chart and must
# also hold `Chart.yaml` and `Chart.lock`. With the default inputs only the
# repository root is searched, which is the one-chart-per-repository layout.
# Repositories holding several charts point `charts-root` and
# `chart-discovery-depth` at the directory the charts live in.
#
#   helm-config.yaml  – Must contain:
#                         • A top-level `environments` map whose keys are the
#                           target environment names, e.g.:
#                             environments:
#                               dev:   { ... }
#                               prod:  { ... }
#                         • A top-level `releaseName` (string, required)
#                         • A top-level `namespace`   (string, required)
#                         • Per-environment `apis` and `valueFiles` lists
#                         • An optional `primaryDependency` naming the subchart
#                           whose version identifies the chart
#   Chart.lock        – Should be committed. It pins the subchart versions that
#                       are installed and rendered. Without it the versions are
#                       resolved at render time and the workflow warns.
#
# Output
# ------
#   hydrated-manifests/                – Directory tree written by helm template,
#                                        one sub-folder per chart component. When
#                                        several charts are hydrated into the same
#                                        branch, each chart owns the sub-directory
#                                        `hydrated-manifests/<chart name>`.
#   Artifact                           – One artifact holding a directory
#                                        `hydrated-<chart>-<environment>` per chart
#                                        and environment, when `upload-artifact`
#                                        is enabled. It is named
#                                        `hydrated-manifests`, followed by
#                                        `-<charts-root>` when charts-root is not
#                                        the repository root.
#   Pull request                       – One PR per changed chart and environment
#                                        targeting the `environments/<name>`
#                                        branch, carrying the rendered manifests
#                                        as a commit on
#                                        `hydration-pull-request/<name>[-<chart>]-<version>`.
#                                        The commit's trailers record the source
#                                        commit and chart version, and the title
#                                        says why the PR exists: a version
#                                        update, a chart change or a re-render.

name: Helm hydration

# This workflow is designed to be called from another workflow via `workflow_call`.
# It exposes six inputs:
#   helm-version             – pin the Helm CLI version for reproducible builds.
#   bundle-patches-in-one-pr – when "true", patch-level updates are grouped into
#                              a single PR instead of one PR per patch release.
#   charts-root              – where to start looking for charts.
#   chart-discovery-depth    – how deep below charts-root to look.
#   create-pull-request      – when false the workflow only renders, and neither
#                              touches the environment branches nor opens a PR.
#   upload-artifact          – publish the rendered manifests as an artifact.
on:
  workflow_call:
    inputs:
      helm-version:
        # Helm version to install. Pin to a specific version (e.g. "v3.17.0")
        # for reproducible builds.
        default: "latest"
        description: "Helm version eg v3.17.0, defaults to latest."
        type: string
      bundle-patches-in-one-pr:
        # When "true" the patch version segment is replaced with "x" so that
        # all patch-level subchart updates are grouped into a single PR/branch
        # instead of creating one PR per patch release.
        default: "true"
        description: "Bundle patch level chart updates in one pr/branch."
        type: string
      charts-root:
        # Directory the chart search starts from. The default searches the
        # repository root only, which is the one-chart-per-repository layout.
        default: "."
        description: "Directory to search for charts, defaults to the repository root."
        type: string
      chart-discovery-depth:
        # Maximum directory depth below charts-root that is searched for
        # helm-config.yaml. Use 2 together with charts-root "apps" for an
        # apps/<chart>/ monorepo layout.
        default: 1
        description: "Maximum search depth for helm-config.yaml below charts-root."
        type: number
      create-pull-request:
        # When false the workflow renders the manifests and stops. Nothing is
        # pushed and no environment branch is created, which makes the workflow
        # usable as a pure validation step on pull requests.
        default: true
        description: "Push the hydrated manifests to the environment branch and open a pull request."
        type: boolean
      upload-artifact:
        # Publishes the rendered manifests of every chart and environment as one
        # workflow artifact holding a directory `hydrated-<chart>-<environment>`
        # per pair.
        default: false
        description: "Upload the hydrated manifests as a workflow artifact."
        type: boolean

jobs:
  # ---------------------------------------------------------------------------
  # Job: hydrate
  # Renders every chart and environment in a single job:
  #   1. Discovers every chart below `charts-root`.
  #   2. Installs the requested Helm version once.
  #   3. Per chart: installs the dependencies, pinned by Chart.lock when it
  #      exists, and resolves the chart name and the primary subchart version.
  #   4. Per chart and environment: renders the manifests via `helm template`.
  #   5. Ensures the `environments/<name>` branches and labels exist.
  #   6. Selects the chart/environment pairs whose manifests changed.
  #   7. Uploads the rendered manifests as an artifact, for the pull-request
  #      jobs and, when `upload-artifact` is enabled, for the caller.
  #
  # A chart or environment that fails to render is reported and skipped, and
  # the others are still hydrated. The job fails at the end of the render step
  # in that case, while the later steps and the pull-request jobs still run for
  # the pairs that did render.
  #
  # Permissions required by this job:
  #   contents: write      – push the initial commit of a new environment branch.
  #   issues: write        – create the per-environment label with a fixed colour.
  #                          Labels are part of the issues API even when they are
  #                          only ever used on pull requests.
  #   pull-requests: read  – look up the open pull request of each pair.
  # ---------------------------------------------------------------------------
  hydrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
    outputs:
      # JSON array of the chart/environment pairs that need a pull request.
      pull-requests: ${{ steps.select.outputs.pull-requests }}
      # Name of the artifact holding the rendered manifests.
      artifact: ${{ steps.discover.outputs.artifact }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Discover charts
      # A directory is a chart when it holds a helm-config.yaml. The sorted
      # list is what the render step iterates over, so the output order does
      # not depend on the order in which the filesystem returns directories.
      id: discover
      env:
        CHARTS_ROOT: ${{ inputs.charts-root }}
        DISCOVERY_DEPTH: ${{ inputs.chart-discovery-depth }}
      run: |
        set -euo pipefail
        # Paths shared by the steps below. They live outside the checkout, so
        # nothing rendered here can end up in a commit by accident.
        CHART_LIST="$RUNNER_TEMP/charts.txt"
        {
          echo "CHART_LIST=$CHART_LIST"
          echo "OUTPUT_ROOT=$RUNNER_TEMP/hydrated"
          echo "PAIRS_FILE=$RUNNER_TEMP/hydrated-pairs.jsonl"
        } >> "$GITHUB_ENV"
        configs=()
        while IFS= read -r -d '' config; do
          configs+=("$config")
        done < <(find "$CHARTS_ROOT" -maxdepth "$DISCOVERY_DEPTH" -name helm-config.yaml -print0 | sort -z)
        if [ "${#configs[@]}" -eq 0 ]; then
          echo "::error::No helm-config.yaml found below '$CHARTS_ROOT' within depth $DISCOVERY_DEPTH."
          exit 1
        fi
        for config in "${configs[@]}"; do
          dirname "$config"
        done > "$CHART_LIST"
        echo "Found ${#configs[@]} chart(s):"
        cat "$CHART_LIST"
        multi_chart=false
        if [ "${#configs[@]}" -gt 1 ]; then
          multi_chart=true
        fi
        # The artifact carries charts-root in its name, so that a caller
        # hydrating several roots in one run does not produce two artifacts of
        # the same name, which GitHub rejects.
        root_suffix=$(printf '%s' "$CHARTS_ROOT" | sed -E 's#^\./##; s#[^A-Za-z0-9._-]+#-#g; s#^-+##; s#-+$##')
        artifact=hydrated-manifests
        if [ -n "$root_suffix" ] && [ "$root_suffix" != "." ]; then
          artifact="$artifact-$root_suffix"
        fi
        {
          echo "multi-chart=$multi_chart"
          echo "artifact=$artifact"
        } >> "$GITHUB_OUTPUT"
    - name: Set up Helm
      # Installs the Helm CLI at the version requested via the workflow input.
      # Pinning to a specific version (e.g. "v3.17.0") ensures reproducible builds.
      uses: azure/setup-helm@v5.0.1
      with:
        version: ${{ inputs.helm-version }}
    - name: Verify Helm installation
      # Prints the installed Helm version to the job log, confirming that the
      # setup step succeeded and making the exact version traceable in CI output.
      run: |
        helm version
    - name: Hydrate
      # Installs the dependencies of every chart once and renders it for each of
      # its environments. The manifests of a pair are written to
      # `$OUTPUT_ROOT/hydrated-<chart>-<environment>`, which holds exactly what
      # ends up in the chart's manifest directory on the environment branch.
      # Every rendered pair is recorded as one JSON line in $PAIRS_FILE.
      #
      # Variables read from helm-config.yaml:
      #   releaseName  – Helm release name (required).
      #   namespace    – Kubernetes namespace (required).
      #   apis         – Comma-separated list of additional Kubernetes API
      #                  groups passed via `-a` to enable conditional rendering
      #                  of resources that depend on CRDs or optional APIs.
      #   valueFiles   – Comma-separated list of values files for the
      #                  current environment, passed via `-f`. The paths are
      #                  relative to the chart directory.
      #
      # helm template flags used:
      #   -a  (--api-versions)   Enable extra API groups for `Capabilities` checks.
      #   -f  (--values)         Merge environment-specific values files.
      #   -n  (--namespace)      Set the release namespace.
      #   --output-dir           Write each rendered manifest to a file instead
      #                          of stdout, preserving the chart directory layout.
      #   --include-crds         Include CRD manifests in the output.
      #   --release-name         Include the release name in the output-dir path.
      #   --skip-tests           Omit test hook manifests from the output.
      id: hydrate
      env:
        MULTI_CHART: ${{ steps.discover.outputs.multi-chart }}
        BUNDLE_PATCHES: ${{ inputs.bundle-patches-in-one-pr }}
        REGISTERED_REPOSITORIES: ${{ runner.temp }}/helm-repositories.txt
      run: |
        set -uo pipefail

        # Installs the subcharts of one chart into its charts/ directory and
        # writes the metadata the render and pull-request steps need to $2. The
        # dependency installation is kept in sync with install_dependencies in
        # helm-unittest.yaml.
        prepare_chart() {
          local chart_dir=$1 metadata_file=$2
          local config="$chart_dir/helm-config.yaml"

          # `helm dependency build` resolves https repositories against the
          # local repository list rather than by URL, and a runner starts with
          # none registered. Every http(s) repository the chart declares is
          # added first. oci:// and file:// dependencies need no entry, and an
          # alias (`@name` or `alias:name`) refers to a repository that has to
          # be registered already, so both are left to Helm. Charts commonly
          # share repositories, so each URL is added once per run, under a name
          # derived from the URL so that two charts using the same dependency
          # name for different repositories cannot overwrite each other's entry.
          # explode(.) resolves the anchors Chart.yaml commonly uses for the
          # dependency name.
          local dep_url
          while IFS= read -r dep_url; do
            case "$dep_url" in
              http://*|https://*) ;;
              *) continue ;;
            esac
            if grep -qxF "$dep_url" "$REGISTERED_REPOSITORIES" 2> /dev/null; then
              continue
            fi
            helm repo add "repo-$(printf '%s' "$dep_url" | sha256sum | cut -c1-12)" "$dep_url" --force-update > /dev/null
            printf '%s\n' "$dep_url" >> "$REGISTERED_REPOSITORIES"
          done < <(yq -N -r 'explode(.) | .dependencies[]? | .repository' "$chart_dir/Chart.yaml")
          # `helm repo add` has just downloaded the index of every repository,
          # so --skip-refresh keeps helm from downloading all of them again for
          # each chart.
          if [ -f "$chart_dir/Chart.lock" ]; then
            # The committed lock file decides which versions are installed,
            # which makes the rendered manifests a function of the commit alone.
            # This fails when Chart.lock and Chart.yaml disagree.
            helm dependency build --skip-refresh "$chart_dir"
          else
            echo "::warning::$chart_dir/Chart.lock is not committed, so the subchart versions are resolved now rather than by the repository, and an upstream release can change the rendered manifests without a commit. Run 'helm dependency update' and commit the lock file."
            helm dependency update --skip-refresh "$chart_dir"
          fi

          # explode(.) resolves YAML anchors and aliases before querying, because
          # Chart.yaml and helm-config.yaml use anchors to avoid repetition.
          local chart_name release_name namespace
          chart_name=$(yq 'explode(.) | .name' "$chart_dir/Chart.yaml")
          release_name=$(yq 'explode(.) | .releaseName // ""' "$config")
          namespace=$(yq 'explode(.) | .namespace // ""' "$config")
          if [ -z "$release_name" ]; then
            echo "::error::releaseName is required in $config"
            return 1
          fi
          if [ -z "$namespace" ]; then
            echo "::error::namespace is required in $config"
            return 1
          fi

          # A repository holding a single chart owns the whole hydrated-manifests
          # directory. Charts sharing an environment branch each own a
          # sub-directory of it and carry their name in the PR branch.
          local manifest_dir branch_suffix
          if [ "$MULTI_CHART" = "true" ]; then
            manifest_dir="hydrated-manifests/$chart_name"
            branch_suffix="-$chart_name"
          else
            manifest_dir="hydrated-manifests"
            branch_suffix=""
          fi

          # The primary dependency is the subchart whose version identifies this
          # chart. It defaults to the dependency sharing the chart's own name,
          # which covers umbrella charts wrapping a single upstream chart of the
          # same name. Charts wrapping a differently named upstream chart declare
          # it explicitly via `primaryDependency` in helm-config.yaml.
          local dep_name version
          dep_name=$(yq 'explode(.) | .primaryDependency // ""' "$config")
          if [ -z "$dep_name" ]; then
            dep_name=$chart_name
          fi
          # Chart.lock records the version installed above, so the reported
          # version always matches the rendered manifests. It is also always a
          # concrete semver rather than a constraint, which keeps it valid
          # inside a git branch name.
          # The dependency is selected by name to be resilient to ordering
          # changes in the dependencies list.
          if [ -f "$chart_dir/Chart.lock" ]; then
            version=$(DEP_NAME=$dep_name yq '.dependencies[] | select(.name == strenv(DEP_NAME)) | .version' "$chart_dir/Chart.lock")
            if [ -z "$version" ]; then
              echo "::error::Dependency '$dep_name' is not listed in $chart_dir/Chart.lock. Set 'primaryDependency' in helm-config.yaml to name the subchart that identifies this chart."
              return 1
            fi
          else
            # A chart without dependencies has no lock file, so its own version
            # identifies it.
            version=$(yq 'explode(.) | .version' "$chart_dir/Chart.yaml")
          fi
          # The exact version goes into the pull request's title and commit,
          # the bundled one into its branch.
          local full_version=$version
          if [ "$BUNDLE_PATCHES" = "true" ]; then
            # Replace the patch segment with "x" to bundle patch updates in one PR.
            version=$(echo "$version" | cut -d. -f1,2).x
          fi

          # The paths whose commits change this chart's manifests: its own
          # directory and every file:// dependency inside the repository. The
          # pull request lists the commits to them since the deployed render.
          # They are joined by spaces, so a path containing one is not supported.
          local source_paths dep_path
          source_paths=$(realpath -m --relative-to=. "$chart_dir")
          while IFS= read -r dep_url; do
            case "$dep_url" in
              file://*) ;;
              *) continue ;;
            esac
            dep_path=$(realpath -m --relative-to=. "$chart_dir/${dep_url#file://}")
            case "$dep_path" in
              ..|../*) continue ;;
            esac
            source_paths+=" $dep_path"
          done < <(yq -N -r 'explode(.) | .dependencies[]? | .repository' "$chart_dir/Chart.yaml")

          jq -n \
            --arg chart_dir "$chart_dir" \
            --arg name "$chart_name" \
            --arg release_name "$release_name" \
            --arg namespace "$namespace" \
            --arg manifest_dir "$manifest_dir" \
            --arg branch_suffix "$branch_suffix" \
            --arg version "$version" \
            --arg full_version "$full_version" \
            --arg source_paths "$source_paths" \
            '{"chart-dir": $chart_dir, name: $name, "release-name": $release_name, namespace: $namespace,
              "manifest-dir": $manifest_dir, "branch-suffix": $branch_suffix, version: $version,
              "full-version": $full_version, "source-paths": $source_paths}' \
            > "$metadata_file"
        }

        # Renders one chart for one environment into $4.
        render_environment() {
          local chart_dir=$1 release_name=$2 namespace=$3 output_dir=$4 hydration=$5
          local config="$chart_dir/helm-config.yaml"
          local apis value_files
          apis=$(hydration=$hydration yq 'explode(.) | (.environments.[env(hydration)].apis // []) | @csv' "$config")
          # Value file paths are declared relative to the chart, so they are
          # prefixed with the chart directory before being handed to helm.
          value_files=$(hydration=$hydration chart_dir=$chart_dir yq 'explode(.) | (.environments.[env(hydration)].valueFiles // []) | map(env(chart_dir) + "/" + .) | @csv' "$config")
          local helm_args=()
          if [ -n "$apis" ]; then
            helm_args+=(-a "$apis")
          fi
          if [ -n "$value_files" ]; then
            helm_args+=(-f "$value_files")
          fi
          helm template "$release_name" "$chart_dir" \
            "${helm_args[@]}" \
            -n "$namespace" \
            --output-dir "$output_dir" \
            --include-crds \
            --release-name \
            --skip-tests
          # Post-process all rendered YAML manifests to inject ArgoCD annotations
          # required for reliable CRD management via server-side apply.
          #
          # Why server-side apply for CRDs?
          #   CRD manifests often carry large `last-applied-configuration`
          #   annotations that exceed the 256 KiB annotation size limit enforced
          #   by Kubernetes. Using ServerSideApply=true tells ArgoCD to apply
          #   them with server-side apply (SSA), which avoids storing the full
          #   manifest in annotations.
          #
          # Why sync-wave "-1"?
          #   Setting the sync-wave to -1 ensures CRDs are applied before all
          #   other resources (wave 0 and above), so that custom resources that
          #   depend on them are never applied before their CRD exists in the
          #   cluster.
          #
          # The yq expression handles three cases for each CRD manifest:
          #   1. No sync-options annotation at all → create it with "ServerSideApply=true".
          #   2. sync-options annotation exists but does not contain "ServerSideApply=" →
          #      append ",ServerSideApply=true" to the existing value.
          #   3. No sync-wave annotation → create it with "-1".
          #      (If sync-wave is already set it is left unchanged.)
          #
          # Only files holding a CRD go through yq. `yq -i` writes the whole
          # file back in its own formatting, so a new yq release on the runner
          # would otherwise change every rendered manifest without a change to
          # the chart, e.g. the blank lines it emits in folded scalars.
          while IFS= read -r -d '' manifest; do
            grep -qE '^kind:[[:space:]]*["'\'']?CustomResourceDefinition["'\'']?[[:space:]]*$' "$manifest" || continue
            yq -i '
              select(.kind == "CustomResourceDefinition" and
                .metadata.annotations["argocd.argoproj.io/sync-options"] == null)
                .metadata.annotations["argocd.argoproj.io/sync-options"] = "ServerSideApply=true" |
              select(.kind == "CustomResourceDefinition" and .metadata.annotations["argocd.argoproj.io/sync-options"] != null and
                (.metadata.annotations["argocd.argoproj.io/sync-options"] |
                contains("ServerSideApply=") | not))
                .metadata.annotations["argocd.argoproj.io/sync-options"] |= . + ",ServerSideApply=true" |
              select(.kind == "CustomResourceDefinition" and .metadata.annotations["argocd.argoproj.io/sync-wave"] == null)
                .metadata.annotations["argocd.argoproj.io/sync-wave"] = "-1"
            ' "$manifest"
          done < <(find "$output_dir" -type f \( -name "*.yaml" -o -name "*.yml" \) -print0)
        }

        # A failing chart or environment must not stop the others, as it did
        # not when every pair ran in a job of its own. The functions therefore
        # run in a child bash with errexit enabled: bash ignores errexit inside
        # a function that is called as the condition of an `if`, but not inside
        # a new process started from there.
        export -f prepare_chart render_environment
        run() {
          bash -euo pipefail -c '"$@"' _ "$@" < /dev/null
        }

        mkdir -p "$OUTPUT_ROOT"
        : > "$PAIRS_FILE"
        metadata="$RUNNER_TEMP/chart-metadata.json"
        failed=()
        while IFS= read -r chart_dir; do
          echo "::group::Install the dependencies of $chart_dir"
          if ! run prepare_chart "$chart_dir" "$metadata"; then
            echo "::endgroup::"
            echo "::error::Could not install the dependencies of $chart_dir, none of its environments was hydrated."
            failed+=("$chart_dir")
            continue
          fi
          echo "::endgroup::"
          chart_name=$(jq -r '.name' "$metadata")
          release_name=$(jq -r '."release-name"' "$metadata")
          namespace=$(jq -r '.namespace' "$metadata")
          # yq extracts the keys of the `environments` map. explode(.) resolves
          # YAML anchors and aliases before querying, because helm-config.yaml
          # commonly shares environment definitions via anchors.
          while IFS= read -r environment; do
            source="hydrated-$chart_name-$environment"
            echo "::group::Hydrate $chart_name for $environment"
            if run render_environment "$chart_dir" "$release_name" "$namespace" "$OUTPUT_ROOT/$source" "$environment"; then
              echo "::endgroup::"
              jq -c --arg env "$environment" --arg source "$source" \
                '. + {env: $env, source: $source, branch: ("hydration-pull-request/" + $env + ."branch-suffix" + "-" + .version)}' \
                "$metadata" >> "$PAIRS_FILE"
            else
              echo "::endgroup::"
              echo "::error::Could not hydrate $chart_dir for $environment."
              rm -rf "${OUTPUT_ROOT:?}/$source"
              failed+=("$chart_dir ($environment)")
            fi
          done < <(yq -r 'explode(.) | .environments | keys | .[]' "$chart_dir/helm-config.yaml")
        done < "$CHART_LIST"

        hydrated=false
        if [ -s "$PAIRS_FILE" ]; then
          hydrated=true
        fi
        echo "hydrated=$hydrated" >> "$GITHUB_OUTPUT"
        echo "Hydrated $(wc -l < "$PAIRS_FILE") chart/environment pair(s)."
        if [ "${#failed[@]}" -gt 0 ]; then
          printf '::error::Hydration failed for %s\n' "${failed[@]}"
          exit 1
        fi
    - name: Prepare environment branches
      # Ensures the `environments/<name>` branch exists on origin before any
      # chart is hydrated into it, creating it as an orphan branch on first use,
      # and gives the environment label a colour.
      #
      # Skipped in render-only mode and when running under act, because nothing
      # is pushed in either case.
      if: ${{ !cancelled() && steps.hydrate.outputs.hydrated == 'true' && inputs.create-pull-request && !env.ACT }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        ACTOR: ${{ github.actor }}
        ACTOR_ID: ${{ github.actor_id }}
      run: |
        set -euo pipefail

        # Gives the "env: <name>" label a colour before any pull request carries
        # it. Without this GitHub creates the label implicitly, the first time it
        # is applied, in a random colour — which defeats the point of colouring
        # the environment in the first place.
        #
        # The tier chooses the colour family and a hash of the full name chooses
        # the shade within it, so that "is this production" is answerable from
        # the colour alone while sibling clusters of the same tier stay apart.
        #
        # The tier is read from the name's segments rather than from the whole
        # name, because an environment is commonly named after its cluster with
        # the tier as one part of it — sf-k8s01-prod is a production environment
        # and sf-k8s02-dev is not, and matching the whole name recognises
        # neither. Segments also stop "sf-devops" from being read as a
        # development tier, which a plain substring match would.
        #
        # Where several tiers appear in one name the most severe wins, so
        # nothing that mentions production is coloured as though it were not.
        #
        # An existing label is left alone. A repository that recoloured it on
        # purpose should not have that reverted on the next hydration run.
        ensure_label() {
          local environment=$1
          local label="env: $environment"

          # tr -cs collapses every run of non-alphanumeric characters into one
          # space, so sf-k8s01-prod becomes the segments "sf k8s01 prod".
          local segments segment rank=0
          segments=$(printf '%s' "$environment" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' ' ')
          for segment in $segments; do
            case "$segment" in
              prod|prod[0-9]*|production|live|prd)  if [ "$rank" -lt 5 ]; then rank=5; fi ;;
              stage|staging|stg|preprod|uat)        if [ "$rank" -lt 4 ]; then rank=4; fi ;;
              test|test[0-9]*|testing|qa|int)       if [ "$rank" -lt 3 ]; then rank=3; fi ;;
              dev|dev[0-9]*|develop|development)    if [ "$rank" -lt 2 ]; then rank=2; fi ;;
              local|localhost|sandbox|demo|kind|minikube)
                                                    if [ "$rank" -lt 1 ]; then rank=1; fi ;;
            esac
          done

          local family
          case "$rank" in
            5) family=(b60205 d73a4a cf222e a40e26 e5534b 8e1519) ;;  # production, red
            4) family=(d93f0b e36209 bf5b04 c2410c ea7317 fb8500) ;;  # staging, orange
            3) family=(1d76db 0052cc 218bff 0366d6 0a3069 4184e4) ;;  # test, blue
            2) family=(0e8a16 2ea043 1a7f37 3fb950 116329 57ab5a) ;;  # development, green
            1) family=(6e7781 57606a 424a53 8c959f 795548 4d5358) ;;  # throwaway, grey
            *) family=(5319e7 006b75 8250df bf3989 9a6700 1b7c83) ;;  # unrecognised
          esac

          # Sibling environments of one tier usually differ only by a number, so
          # the number picks the shade where there is one: consecutive clusters
          # then get consecutive shades and cannot collide, which a hash of names
          # differing in one character regularly does. 10# forces base ten, or a
          # zero padded 08 would be read as an invalid octal literal. Only the
          # last six digits are used, so a name carrying a date cannot overflow.
          #
          # Names with no number fall back to a hash of the name, which is stable
          # for a given name across every run and every repository.
          local digits index colour error
          digits=$(printf '%s' "$environment" | tr -cd '0-9' | tail -c 6)
          if [ -n "$digits" ]; then
            index=$(( 10#$digits % ${#family[@]} ))
          else
            index=$(( 0x$(printf '%s' "$environment" | sha256sum | cut -c1-4) % ${#family[@]} ))
          fi
          colour=${family[$index]}

          if error=$(gh label create "$label" \
                --color "$colour" \
                --description "Hydrated manifests for the $environment environment" 2>&1); then
            echo "Created label '$label' in #$colour."
          elif printf '%s' "$error" | grep -q "already exists"; then
            echo "Label '$label' already exists, leaving its colour alone."
          else
            # Most likely the calling workflow does not grant issues: write. The
            # label is still applied to the pull request, so this is not fatal.
            echo "::warning::could not create the label '$label': $error"
          fi
        }

        # A git identity must be set for the initial commit because the GitHub
        # Actions runner has no global git user set by default.
        # github.actor_id and github.actor are built-in context variables, so
        # no API call is needed to construct the standard GitHub noreply address
        # (<id>+<login>@users.noreply.github.com).
        export GIT_AUTHOR_NAME="$ACTOR" GIT_COMMITTER_NAME="$ACTOR"
        export GIT_AUTHOR_EMAIL="${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
        export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
        # An orphan commit with an empty tree gives the hydrated manifests a
        # clean history separate from the branch the chart sources live on. It
        # is written with plumbing commands, so the checkout stays untouched.
        empty_tree=$(git mktree < /dev/null)

        while IFS= read -r environment; do
          branch="environments/$environment"
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null 2>&1; then
            echo "Branch '$branch' already exists on origin."
          else
            commit=$(git commit-tree "$empty_tree" -m "chore: initialise $branch branch")
            # A concurrent run may have created the branch in the meantime,
            # which rejects this push but leaves the branch in place.
            if ! git push origin "$commit:refs/heads/$branch" \
                && ! git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null 2>&1; then
              echo "::error::Could not create the branch '$branch'."
              exit 1
            fi
          fi
          ensure_label "$environment"
        done < <(jq -r '.env' "$PAIRS_FILE" | sort -u)
    - name: Select pull requests
      # Keeps the chart/environment pairs whose rendered manifests differ from
      # what is already proposed or deployed, so that only those start a
      # pull-request job:
      #   • With an open pull request for the pair's branch, the manifests are
      #     compared against that branch. The pull request is also refreshed when
      #     its branch no longer builds on the tip of the environment branch.
      #   • Without one, they are compared against the environment branch.
      #
      # The comparison is between git tree hashes, computed for the rendered
      # directory with a throwaway index, so no file is copied or checked out.
      #
      # All remote state is gathered up front: one API call lists the open
      # pull requests and one fetch brings in every environment branch and
      # every open pull request branch. The per-pair comparison then runs
      # locally, so its cost does not grow with the number of round-trips.
      id: select
      if: ${{ !cancelled() && steps.hydrate.outputs.hydrated == 'true' && inputs.create-pull-request && !env.ACT }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        git_dir=$(git rev-parse --absolute-git-dir)
        index="$RUNNER_TEMP/compare.index"

        # Prints the git tree hash of a directory. -f includes files a
        # .gitignore would exclude, so nothing rendered is silently left out of
        # the comparison.
        tree_of() {
          rm -f "$index"
          GIT_INDEX_FILE=$index git -C "$1" --git-dir="$git_dir" --work-tree="$1" add -A -f .
          GIT_INDEX_FILE=$index git --git-dir="$git_dir" write-tree
          rm -f "$index"
        }

        # Open hydration pull requests, keyed by their head branch, with the
        # branch they target as the value. Only pull requests whose head is
        # the branch of a hydrated pair are kept.
        declare -A open_prs=()
        while IFS=$'\t' read -r head base; do
          open_prs[$head]=$base
        done < <(gh pr list --state open --limit 1000 --json headRefName,baseRefName \
          | jq -r --slurpfile pairs "$PAIRS_FILE" \
              '($pairs | map(.branch)) as $branches
               | .[] | select(.headRefName as $h | $branches | index($h)) | [.headRefName, .baseRefName] | @tsv')

        # One fetch for every environment branch and every open pull request
        # branch. peter-evans/create-pull-request keeps a pull request branch
        # one commit ahead of its base, so a short history is enough to find
        # the base tip in it. Should it not be found, the pull request is
        # refreshed, which is what every run did before the comparison existed.
        refspecs=()
        while IFS= read -r environment; do
          refspecs+=("+refs/heads/environments/$environment:refs/remotes/origin/environments/$environment")
        done < <(jq -r '.env' "$PAIRS_FILE" | sort -u)
        for head in "${!open_prs[@]}"; do
          refspecs+=("+refs/heads/$head:refs/remotes/origin/$head")
        done
        git fetch --quiet --no-tags --depth=10 origin "${refspecs[@]}"

        selected=()
        while IFS=$'\t' read -r environment name branch manifest_dir source; do
          base="environments/$environment"
          reference="refs/remotes/origin/$base"
          if [ "${open_prs[$branch]:-}" = "$base" ]; then
            reference="refs/remotes/origin/$branch"
            if ! git merge-base --is-ancestor "refs/remotes/origin/$base" "$reference"; then
              echo "$name/$environment: the open pull request does not build on $base, refreshing it."
              selected+=("$source")
              continue
            fi
          fi
          rendered=$(tree_of "$OUTPUT_ROOT/$source")
          current=$(git rev-parse --verify --quiet "$reference:$manifest_dir" || true)
          if [ "$rendered" = "$current" ]; then
            echo "$name/$environment: unchanged against ${reference#refs/remotes/origin/}, skipping."
          else
            echo "$name/$environment: changed against ${reference#refs/remotes/origin/}."
            selected+=("$source")
          fi
        done < <(jq -r '[.env, .name, .branch, ."manifest-dir", .source] | @tsv' "$PAIRS_FILE")

        # The source directory is unique per chart and environment, so it
        # identifies the selected pairs.
        keep=$(printf '%s\n' "${selected[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')
        # The pull-request jobs are named after these values in this order,
        # and callers read the environment and chart from the job name, so
        # new keys go at the end.
        pull_requests=$(jq -sc --argjson keep "$keep" \
          '[.[] | select(.source as $s | $keep | index($s)) | {env, name, source, branch, version, "manifest-dir", "full-version", "source-paths"}]' \
          "$PAIRS_FILE")
        echo "pull-requests=$pull_requests" >> "$GITHUB_OUTPUT"
        echo "${#selected[@]} pair(s) need a pull request."
    - name: Upload hydrated manifests
      # Publishes the rendered manifests for the pull-request jobs below and,
      # when `upload-artifact` is enabled, for the calling workflow. An artifact
      # that only serves the pull-request jobs is kept for one day.
      if: ${{ !cancelled() && steps.hydrate.outputs.hydrated == 'true' && (inputs.upload-artifact || (steps.select.outputs.pull-requests != '' && steps.select.outputs.pull-requests != '[]')) }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.discover.outputs.artifact }}
        path: ${{ runner.temp }}/hydrated/
        if-no-files-found: error
        retention-days: ${{ !inputs.upload-artifact && 1 || '' }}

  # ---------------------------------------------------------------------------
  # Job: create-pull-request
  # Runs once per chart and environment whose manifests changed, as selected by
  # the `hydrate` job, and opens (or updates) a pull request against the
  # environment branch so the GitOps agent (e.g. ArgoCD) can pick up the new
  # manifests. It needs no Helm: the manifests come from the artifact.
  #
  # It still runs when `hydrate` failed for some other chart, so a broken chart
  # does not hold back the pull requests of the charts that did render.
  #
  # Matrix variable:
  #   entry.name           – the chart name, e.g. "loki"
  #   entry.env            – the environment name, e.g. "dev"
  #   entry.manifest-dir   – the chart's directory on the environment branch
  #   entry.source         – the pair's directory inside the artifact
  #   entry.branch         – the pull request's source branch
  #   entry.version        – the version in the branch name, patch bundled
  #   entry.full-version   – the exact version, for the title and the commit
  #   entry.source-paths   – the chart's paths in the repository, space separated
  # ---------------------------------------------------------------------------
  create-pull-request:
    runs-on: ubuntu-latest
    needs:
    - hydrate
    if: ${{ !cancelled() && inputs.create-pull-request && needs.hydrate.outputs.pull-requests != '' && needs.hydrate.outputs.pull-requests != '[]' }}
    # Permissions required by the `Create pull request` step:
    #   contents: write       – push the hydrated-manifests source branch.
    #   pull-requests: write  – open / update the PR against the environment branch.
    permissions:
      contents: write
      pull-requests: write
    strategy:
      # fail-fast is set to false so that a failing pull request does not
      # cancel its siblings.
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.hydrate.outputs.pull-requests) }}
    steps:
    - name: Checkout the environment branch
      # The environment branch is guaranteed to exist by the hydrate job.
      uses: actions/checkout@v7
      with:
        ref: environments/${{ matrix.entry.env }}
        # The whole history without file contents: the next step reads the
        # commits of the environment branch and of the rendered commit, but
        # never a file of either.
        fetch-depth: 0
        filter: blob:none
    - name: Describe the change
      # Works out why this pull request exists, from the trailers the commit
      # that last changed the chart's directory on the environment branch
      # carries (`Hydrated-From`, the commit it was rendered from, and
      # `Chart-Version`), and from the commits since then to the chart's paths:
      #   • version  – the chart version differs from the deployed one.
      #   • change   – the version is the same, but commits changed the chart.
      #   • rerender – no commit changed the chart, so the difference comes from
      #                the rendering itself: Helm, yq or this workflow.
      #   • unknown  – the environment branch records no render for the chart
      #                yet, e.g. on the first run of this version of the workflow.
      # Its outputs are the title, body and commit message of the pull request.
      # The description is informative only, so a failed lookup falls back to
      # `unknown` rather than holding back the pull request.
      id: describe
      if: ${{ !env.ACT }}
      env:
        GH_TOKEN: ${{ github.token }}
        CHART: ${{ matrix.entry.name }}
        ENVIRONMENT: ${{ matrix.entry.env }}
        MANIFEST_DIR: ${{ matrix.entry.manifest-dir }}
        FULL_VERSION: ${{ matrix.entry.full-version }}
        SOURCE_PATHS: ${{ matrix.entry.source-paths }}
        SOURCE_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        read -ra paths <<< "$SOURCE_PATHS"
        # At most this many commits are looked up and listed.
        max_listed=30

        # The deployed render: only the newest commit to the chart's directory
        # counts, since an older one's trailers describe a render that has been
        # replaced since. A merge commit is passed over by the path filter for
        # the commit it merged, which carries the trailers.
        deployed_sha="" deployed_version=""
        last=$(git log -1 --format=%H HEAD -- "$MANIFEST_DIR")
        if [ -n "$last" ]; then
          deployed_sha=$(git log -1 --format='%(trailers:key=Hydrated-From,valueonly,separator=)' "$last")
          deployed_version=$(git log -1 --format='%(trailers:key=Chart-Version,valueonly,separator=)' "$last")
        fi

        # The rendered commit with its history, again without file contents. A
        # deployed commit that is not an ancestor of it, e.g. one from another
        # branch, cannot be compared with and is treated as unknown.
        if ! [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
          deployed_sha=""
        elif ! git fetch --quiet --no-tags --filter=blob:none origin "$SOURCE_SHA"; then
          echo "::warning::Could not fetch $SOURCE_SHA, the pull request is described without its changes."
          deployed_sha=""
        elif ! git merge-base --is-ancestor "$deployed_sha" "$SOURCE_SHA" 2> /dev/null; then
          echo "::warning::The deployed render of $CHART comes from $deployed_sha, which is not an ancestor of $SOURCE_SHA."
          deployed_sha=""
        fi

        cause=unknown
        commits=()
        if [ -n "$deployed_sha" ]; then
          mapfile -t commits < <(git log --no-merges --format='%H%x09%s' "$deployed_sha..$SOURCE_SHA" -- "${paths[@]}")
          if [ -n "$deployed_version" ] && [ "$deployed_version" != "$FULL_VERSION" ]; then
            cause=version
          elif [ "${#commits[@]}" -gt 0 ]; then
            cause=change
          else
            cause=rerender
          fi
        fi

        # One entry per pull request the commits were merged with, newest
        # first, or the commit itself when it was pushed directly. Of several
        # pull requests holding a commit, the first one merged brought it in.
        changes=()
        declare -A seen=()
        for line in "${commits[@]:0:$max_listed}"; do
          sha=${line%%$'\t'*}
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
            --jq '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | first | select(.) | "\(.number)\t\(.title)"' 2> /dev/null || true)
          if [ -n "$pr" ]; then
            number=${pr%%$'\t'*}
            if [ -n "${seen[$number]:-}" ]; then
              continue
            fi
            seen[$number]=1
            changes+=("#$number"$'\t'"${pr#*$'\t'}")
          else
            changes+=("$sha"$'\t'"${line#*$'\t'}")
          fi
        done
        unlisted=$(( ${#commits[@]} > max_listed ? ${#commits[@]} - max_listed : 0 ))

        prefix="💧 [$ENVIRONMENT] $CHART"
        case "$cause" in
          version)
            title="$prefix $deployed_version → $FULL_VERSION" ;;
          change)
            newest=${changes[0]}
            reference=${newest%%$'\t'*}
            title="$prefix: ${newest#*$'\t'}"
            if [[ "$reference" == "#"* ]]; then
              title+=" ($reference)"
            fi
            more=$(( ${#changes[@]} - 1 + unlisted ))
            if [ "$more" -gt 0 ]; then
              title+=" (+$more more)"
            fi ;;
          rerender)
            title="$prefix: re-rendered without a chart change" ;;
          *)
            title="💧 [$ENVIRONMENT] Hydrated manifests for $CHART $FULL_VERSION" ;;
        esac
        # GitHub rejects a title longer than 256 characters.
        if [ "${#title}" -gt 256 ]; then
          title="${title:0:255}…"
        fi

        body=$(
          echo "Rendered from [\`${SOURCE_SHA:0:7}\`]($repo_url/commit/$SOURCE_SHA)."
          echo
          if [ "$cause" = version ]; then
            echo "Chart version: \`$deployed_version\` → \`$FULL_VERSION\`"
            echo
          fi
          if [ -z "$deployed_sha" ]; then
            echo "The environment branch records no render of this chart from an earlier commit, so the changes since the deployed one cannot be listed."
          else
            echo "The environment branch holds the render of [\`${deployed_sha:0:7}\`]($repo_url/commit/$deployed_sha)."
            echo
            if [ "${#changes[@]}" -eq 0 ]; then
              echo "No commit since then changed \`${paths[*]}\`. The difference comes from the rendering itself: the Helm or yq version on the runner, or the hydration workflow."
            else
              echo "Changes to \`${paths[*]}\` since then:"
              echo
              for change in "${changes[@]}"; do
                reference=${change%%$'\t'*}
                if [[ "$reference" == "#"* ]]; then
                  echo "- $reference ${change#*$'\t'}"
                else
                  echo "- [\`${reference:0:7}\`]($repo_url/commit/$reference) ${change#*$'\t'}"
                fi
              done
              if [ "$unlisted" -gt 0 ]; then
                echo "- and $unlisted older commit(s)"
              fi
            fi
          fi
        )

        # The trailers are what the next run reads as the deployed render.
        message=$(printf 'Hydrate %s %s for %s\n\nHydrated-From: %s\nChart-Version: %s\n' \
          "$CHART" "$FULL_VERSION" "$ENVIRONMENT" "$SOURCE_SHA" "$FULL_VERSION")

        delimiter="EOF-$(openssl rand -hex 16)"
        {
          echo "cause=$cause"
          echo "title=$title"
          printf 'body<<%s\n%s\n%s\n' "$delimiter" "$body" "$delimiter"
          printf 'commit-message<<%s\n%s\n%s\n' "$delimiter" "$message" "$delimiter"
        } >> "$GITHUB_OUTPUT"
        echo "$cause: $title"
    - name: Download hydrated manifests
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.hydrate.outputs.artifact }}
        path: ${{ runner.temp }}/hydrated
    - name: Collect manifests
      # Moves the rendered manifests of this chart and environment into the
      # working directory.
      env:
        MANIFEST_DIR: ${{ matrix.entry.manifest-dir }}
        SOURCE: ${{ matrix.entry.source }}
      run: |
        set -euo pipefail
        # Remove the output of a previous run for this chart only, so that
        # sibling charts sharing the branch keep their manifests.
        rm -rf "${MANIFEST_DIR:?}"
        mkdir -p "$MANIFEST_DIR"
        mv -v "${RUNNER_TEMP}/hydrated/$SOURCE"/* "$MANIFEST_DIR/"
        git status
    - name: Create pull request
      # Opens (or updates) one pull request per chart and environment with the
      # freshly rendered manifests.
      #
      # Condition:
      #   if: ${{ !env.ACT }}  – Skips this step when the workflow is executed
      #                          locally with `act` (https://github.com/nektos/act).
      #                          The `ACT` environment variable is set automatically
      #                          by act, so the step only runs in real GitHub Actions
      #                          where a pull request can actually be opened.
      #
      # Parameters:
      #   base    – Target branch the PR merges into; one branch per environment.
      #   branch  – Source branch created/updated with the hydrated manifests.
      #             Includes the chart name when the repository holds several
      #             charts, and the subchart version so that each chart version
      #             gets its own branch and open PRs from different versions
      #             coexist.
      #   labels  – Labels applied to the PR for filtering and automation rules,
      #             including "env: <name>" so the environment is visible in the
      #             pull request list without reading the title. Its colour is
      #             set once per environment by the hydrate job.
      #   title   – PR title, prefixed with the 💧 emoji for immediate recognition
      #             and saying why the pull request exists, as worked out by the
      #             `Describe the change` step. The body lists the changes.
      #   commit-message – carries the trailers the next run reads as the
      #             deployed render.
      #   labels  – also `rerender` when no commit changed the chart.
      id: create
      if: ${{ !env.ACT }}
      uses: peter-evans/create-pull-request@v8.1.1
      with:
        # Only include this chart's hydrated manifests in the PR, not any other
        # changes that may be present in the working tree.
        add-paths: |
          ${{ matrix.entry.manifest-dir }}/
        # Target branch: one long-lived branch per environment holds the latest
        # hydrated state and is watched by the GitOps agent (e.g. ArgoCD).
        base: environments/${{ matrix.entry.env }}
        # Source branch: includes the subchart version so that parallel PRs for
        # different chart versions never overwrite each other's branch.
        branch: ${{ matrix.entry.branch }}
        labels: |
          hydration
          automated pr
          env: ${{ matrix.entry.env }}
          ${{ steps.describe.outputs.cause == 'rerender' && 'rerender' || '' }}
        title: ${{ steps.describe.outputs.title }}
        body: ${{ steps.describe.outputs.body }}
        commit-message: ${{ steps.describe.outputs.commit-message }}
    - name: Remove the rerender label
      # create-pull-request only adds labels, so a pull request that was a pure
      # re-render and now holds a chart change would keep the label.
      if: ${{ !env.ACT && steps.describe.outputs.cause != 'rerender' && steps.create.outputs.pull-request-number != '' }}
      env:
        GH_TOKEN: ${{ github.token }}
        NUMBER: ${{ steps.create.outputs.pull-request-number }}
      run: |
        set -euo pipefail
        if gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/labels" --jq '.[].name' | grep -qx rerender; then
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$NUMBER/labels/rerender" > /dev/null
          echo "Removed the rerender label from #$NUMBER."
        fi
