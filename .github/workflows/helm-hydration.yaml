# Helm Hydration
#
# This is the complete, production-ready Helm hydration pipeline. It combines
# all building blocks: it discovers the charts in the repository, dynamically
# builds a GitHub Actions job matrix from the environment keys defined in their
# `helm-config.yaml`, installs Helm, installs the chart dependencies pinned in
# `Chart.lock`, renders environment-specific Kubernetes manifests using
# `helm template`, and opens a version-aware pull request per chart and
# environment. Optionally, patch-level subchart updates are bundled into a
# single PR by replacing the patch segment of the version with "x".
#
# Purpose
# -------
# Instead of hard-coding environment names (e.g. dev, staging, prod) inside
# the workflow, they are read at runtime from `helm-config.yaml`.  The
# resulting JSON array fans out into parallel jobs – one per chart and
# environment – each of which produces a fully rendered set of manifests ready
# for GitOps consumption.
#
# Expected repository layout
# --------------------------
# Every directory containing a `helm-config.yaml` is treated as a chart and must
# also hold `Chart.yaml` and `Chart.lock`. With the default inputs only the
# repository root is searched, which is the one-chart-per-repository layout.
# Repositories holding several charts point `charts-root` and
# `chart-discovery-depth` at the directory the charts live in.
#
#   helm-config.yaml  – Must contain:
#                         • A top-level `environments` map whose keys are the
#                           target environment names, e.g.:
#                             environments:
#                               dev:   { ... }
#                               prod:  { ... }
#                         • A top-level `releaseName` (string, required)
#                         • A top-level `namespace`   (string, required)
#                         • Per-environment `apis` and `valueFiles` lists
#                         • An optional `primaryDependency` naming the subchart
#                           whose version identifies the chart
#   Chart.lock        – Should be committed. It pins the subchart versions that
#                       are installed and rendered. Without it the versions are
#                       resolved at render time and the workflow warns.
#
# Output
# ------
#   define-matrix.outputs.matrix       – JSON array of chart/environment pairs, e.g.
#                                        [{"chart":".","env":"dev"}].
#                                        Consumed downstream via fromJSON().
#   define-matrix.outputs.environments – JSON array of the distinct environment
#                                        names across all charts, e.g. ["dev","prod"].
#   define-matrix.outputs.multi-chart  – "true" when more than one chart was found.
#   hydrated-manifests/                – Directory tree written by helm template,
#                                        one sub-folder per chart component. When
#                                        several charts are hydrated into the same
#                                        branch, each chart owns the sub-directory
#                                        `hydrated-manifests/<chart name>`.
#   Artifact                           – One artifact per chart and environment
#                                        holding the rendered manifests, when
#                                        `upload-artifact` is enabled.
#   Pull request                       – One PR per chart and environment targeting
#                                        the `environments/<name>` branch, carrying
#                                        the rendered manifests as a commit on
#                                        `hydration-pull-request/<name>[-<chart>]-<version>`.

name: Helm hydration

# This workflow is designed to be called from another workflow via `workflow_call`.
# It exposes six inputs:
#   helm-version             – pin the Helm CLI version for reproducible builds.
#   bundle-patches-in-one-pr – when "true", patch-level updates are grouped into
#                              a single PR instead of one PR per patch release.
#   charts-root              – where to start looking for charts.
#   chart-discovery-depth    – how deep below charts-root to look.
#   create-pull-request      – when false the workflow only renders, and neither
#                              touches the environment branches nor opens a PR.
#   upload-artifact          – publish the rendered manifests as an artifact.
on:
  workflow_call:
    inputs:
      helm-version:
        # Helm version to install. Pin to a specific version (e.g. "v3.17.0")
        # for reproducible builds.
        default: "latest"
        description: "Helm version eg v3.17.0, defaults to latest."
        type: string
      bundle-patches-in-one-pr:
        # When "true" the patch version segment is replaced with "x" so that
        # all patch-level subchart updates are grouped into a single PR/branch
        # instead of creating one PR per patch release.
        default: "true"
        description: "Bundle patch level chart updates in one pr/branch."
        type: string
      charts-root:
        # Directory the chart search starts from. The default searches the
        # repository root only, which is the one-chart-per-repository layout.
        default: "."
        description: "Directory to search for charts, defaults to the repository root."
        type: string
      chart-discovery-depth:
        # Maximum directory depth below charts-root that is searched for
        # helm-config.yaml. Use 2 together with charts-root "apps" for an
        # apps/<chart>/ monorepo layout.
        default: 1
        description: "Maximum search depth for helm-config.yaml below charts-root."
        type: number
      create-pull-request:
        # When false the workflow renders the manifests and stops. Nothing is
        # pushed and no environment branch is created, which makes the workflow
        # usable as a pure validation step on pull requests.
        default: true
        description: "Push the hydrated manifests to the environment branch and open a pull request."
        type: boolean
      upload-artifact:
        # Publishes the rendered manifests of each chart and environment as a
        # workflow artifact named `hydrated-<chart>-<environment>`.
        default: false
        description: "Upload the hydrated manifests as a workflow artifact."
        type: boolean

jobs:
  # ---------------------------------------------------------------------------
  # Job: define-matrix
  # Discovers every chart below `charts-root` and expands it into one matrix
  # entry per environment declared in that chart's helm-config.yaml.
  #
  # Example output:  matrix=[{"chart":"apps/loki","env":"dev"}]
  #                  environments=["dev","prod"]
  #                  multi-chart=true
  # ---------------------------------------------------------------------------
  define-matrix:
    runs-on: ubuntu-latest
    outputs:
      # JSON array of {chart, env} objects, one per chart and environment.
      matrix: ${{ steps.define.outputs.matrix }}
      # JSON array of the distinct environment names, e.g. ["dev","prod"].
      environments: ${{ steps.define.outputs.environments }}
      # "true" when the repository holds more than one chart.
      multi-chart: ${{ steps.define.outputs.multi-chart }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Discover charts and environments
      id: define
      env:
        CHARTS_ROOT: ${{ inputs.charts-root }}
        DISCOVERY_DEPTH: ${{ inputs.chart-discovery-depth }}
      run: |
        set -euo pipefail
        # A directory is a chart when it holds a helm-config.yaml.
        configs=()
        while IFS= read -r -d '' config; do
          configs+=("$config")
        done < <(find "$CHARTS_ROOT" -maxdepth "$DISCOVERY_DEPTH" -name helm-config.yaml -print0 | sort -z)
        if [ "${#configs[@]}" -eq 0 ]; then
          echo "::error::No helm-config.yaml found below '$CHARTS_ROOT' within depth $DISCOVERY_DEPTH."
          exit 1
        fi
        # yq extracts the keys of the `environments` map and converts them to
        # a compact (single-line) JSON array, which is the format required by
        # the GitHub Actions `fromJSON()` expression used in matrix definitions.
        # explode(.) resolves YAML anchors and aliases before querying, because
        # helm-config.yaml commonly shares environment definitions via anchors.
        # The result is sorted so the matrix order does not depend on the order
        # in which the filesystem returns the chart directories.
        matrix=$(
          for config in "${configs[@]}"; do
            yq -o=json -I=0 'explode(.) | .environments | keys' "$config" \
              | jq -c --arg chart "$(dirname "$config")" '.[] | {chart: $chart, env: .}'
          done | jq -sc 'sort_by(.chart, .env)'
        )
        # The distinct environments drive the branch preparation job below.
        environments=$(jq -c '[.[].env] | unique' <<< "$matrix")
        multi_chart=false
        if [ "${#configs[@]}" -gt 1 ]; then
          multi_chart=true
        fi
        {
          echo "matrix=$matrix"
          echo "environments=$environments"
          echo "multi-chart=$multi_chart"
        } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job: prepare-environment-branches
  # Ensures the `environments/<name>` branch exists on origin before any chart
  # is hydrated into it, creating it as an orphan branch on first use.
  #
  # Running this once per environment keeps the hydration jobs of several charts
  # from racing each other to create the same branch. The job is skipped when
  # `create-pull-request` is false, because nothing is pushed in that case.
  #
  # Matrix variable:
  #   environment – the environment name for this job instance, e.g. "dev"
  # ---------------------------------------------------------------------------
  prepare-environment-branches:
    runs-on: ubuntu-latest
    needs:
    - define-matrix
    if: ${{ inputs.create-pull-request }}
    # Permissions required to push the initial commit of a new environment branch.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.define-matrix.outputs.environments) }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Ensure environment branch exists
      env:
        BRANCH: environments/${{ matrix.environment }}
        ACTOR: ${{ github.actor }}
        ACTOR_ID: ${{ github.actor_id }}
      run: |
        set -euo pipefail
        if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
          echo "Branch '$BRANCH' already exists on origin."
          exit 0
        fi
        # A git identity must be configured before committing because the
        # GitHub Actions runner has no global git user set by default.
        # github.actor_id and github.actor are built-in context variables, so
        # no API call is needed to construct the standard GitHub noreply address
        # (<id>+<login>@users.noreply.github.com).
        git config user.name "$ACTOR"
        git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
        # An orphan branch gives the hydrated manifests a clean history separate
        # from the branch the chart sources live on.
        git switch --orphan "$BRANCH"
        git commit --allow-empty -m "chore: initialise $BRANCH branch"
        git push origin "$BRANCH"

  # ---------------------------------------------------------------------------
  # Job: hydrate-chart
  # Runs once per chart and environment in the matrix produced by
  # `define-matrix`. Each parallel job:
  #   1. Installs the requested Helm version.
  #   2. Installs the chart dependencies, pinned by Chart.lock when it exists.
  #   3. Resolves the chart name and the primary subchart version.
  #   4. Renders environment-specific Kubernetes manifests via `helm template`.
  #   5. Collects them under `hydrated-manifests`, on the `environments/<name>`
  #      branch when a pull request is created.
  #   6. Opens (or updates) a pull request against the environment branch so
  #      the GitOps agent (e.g. ArgoCD) can pick up the new manifests.
  #
  # Matrix variable:
  #   entry.chart – the chart directory for this job instance, e.g. "apps/loki"
  #   entry.env   – the environment name for this job instance, e.g. "dev"
  # ---------------------------------------------------------------------------
  hydrate-chart:
    runs-on: ubuntu-latest
    needs:
    - define-matrix
    - prepare-environment-branches
    # prepare-environment-branches is skipped when no pull request is created,
    # and a skipped dependency would otherwise skip this job as well.
    if: ${{ !cancelled() && needs.define-matrix.result == 'success' && needs.prepare-environment-branches.result != 'failure' }}
    # Permissions required by the `Create pull request` step:
    #   contents: write       – push the hydrated-manifests source branch.
    #   pull-requests: write  – open / update the PR against the environment branch.
    permissions:
      contents: write
      pull-requests: write
    strategy:
      # Run all chart/environment jobs in parallel. fail-fast is set to false so
      # that a failing matrix job does not cancel sibling jobs.
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Set up Helm
      # Installs the Helm CLI at the version requested via the workflow input.
      # Pinning to a specific version (e.g. "v3.17.0") ensures reproducible builds.
      uses: azure/setup-helm@v5.0.0
      with:
        version: ${{ inputs.helm-version }}
    - name: Verify Helm installation
      # Prints the installed Helm version to the job log, confirming that the
      # setup step succeeded and making the exact version traceable in CI output.
      run: |
        helm version
    - name: Build Helm dependencies
      # Installs the subcharts into charts/. This must run before the version is
      # resolved and before templating, because it is what produces Chart.lock
      # for a chart that does not commit one.
      env:
        CHART_DIR: ${{ matrix.entry.chart }}
      run: |
        set -euo pipefail
        # `helm dependency build` resolves https repositories against the local
        # repository list rather than by URL, and a runner starts with none
        # registered. Every repository the chart declares is added first; oci://
        # and file:// dependencies need no entry. explode(.) resolves the anchors
        # Chart.yaml commonly uses for the dependency name.
        while IFS=$'\t' read -r dep_name dep_url; do
          case "$dep_url" in
            ''|oci://*|file://*) continue ;;
          esac
          helm repo add "$dep_name" "$dep_url" --force-update > /dev/null
        done < <(yq -N -r 'explode(.) | .dependencies[]? | [.name, .repository] | @tsv' "$CHART_DIR/Chart.yaml")
        if [ -f "$CHART_DIR/Chart.lock" ]; then
          # The committed lock file decides which versions are installed, which
          # makes the rendered manifests a function of the commit alone. This
          # fails when Chart.lock and Chart.yaml disagree.
          helm dependency build "$CHART_DIR"
        else
          echo "::warning::$CHART_DIR/Chart.lock is not committed, so the subchart versions are resolved now rather than by the repository, and an upstream release can change the rendered manifests without a commit. Run 'helm dependency update' and commit the lock file."
          helm dependency update "$CHART_DIR"
        fi
    - name: Resolve chart metadata
      # Derives everything that depends on which chart is being hydrated: the
      # chart name, the directory the manifests are written to, the suffix that
      # keeps PR branches of different charts apart, and the version reported in
      # the branch name and PR title.
      id: chart
      env:
        CHART_DIR: ${{ matrix.entry.chart }}
        MULTI_CHART: ${{ needs.define-matrix.outputs.multi-chart }}
        BUNDLE_PATCHES: ${{ inputs.bundle-patches-in-one-pr }}
      run: |
        set -euo pipefail
        # explode(.) resolves YAML anchors and aliases before querying, because
        # Chart.yaml and helm-config.yaml use anchors to avoid repetition.
        CHART_NAME=$(yq 'explode(.) | .name' "$CHART_DIR/Chart.yaml")
        # A repository holding a single chart owns the whole hydrated-manifests
        # directory. Charts sharing an environment branch each own a
        # sub-directory of it and carry their name in the PR branch.
        if [ "$MULTI_CHART" = "true" ]; then
          MANIFEST_DIR="hydrated-manifests/$CHART_NAME"
          BRANCH_SUFFIX="-$CHART_NAME"
        else
          MANIFEST_DIR="hydrated-manifests"
          BRANCH_SUFFIX=""
        fi
        # The primary dependency is the subchart whose version identifies this
        # chart. It defaults to the dependency sharing the chart's own name, which
        # covers umbrella charts wrapping a single upstream chart of the same name.
        # Charts wrapping a differently named upstream chart declare it explicitly
        # via `primaryDependency` in helm-config.yaml.
        DEP_NAME=$(yq 'explode(.) | .primaryDependency // ""' "$CHART_DIR/helm-config.yaml")
        if [ -z "$DEP_NAME" ]; then
          DEP_NAME=$CHART_NAME
        fi
        # Chart.lock records the version installed by the previous step, so the
        # reported version always matches the rendered manifests. It is also
        # always a concrete semver rather than a constraint, which keeps it valid
        # inside a git branch name.
        # The dependency is selected by name to be resilient to ordering changes
        # in the dependencies list.
        if [ -f "$CHART_DIR/Chart.lock" ]; then
          VERSION=$(DEP_NAME=$DEP_NAME yq '.dependencies[] | select(.name == strenv(DEP_NAME)) | .version' "$CHART_DIR/Chart.lock")
          if [ -z "$VERSION" ]; then
            echo "::error::Dependency '$DEP_NAME' is not listed in $CHART_DIR/Chart.lock. Set 'primaryDependency' in helm-config.yaml to name the subchart that identifies this chart."
            exit 1
          fi
        else
          # A chart without dependencies has no lock file, so its own version
          # identifies it.
          VERSION=$(yq 'explode(.) | .version' "$CHART_DIR/Chart.yaml")
        fi
        if [ "$BUNDLE_PATCHES" = "true" ]; then
          # Replace the patch segment with "x" to bundle patch updates in one PR.
          VERSION=$(echo "$VERSION" | cut -d. -f1,2).x
        fi
        {
          echo "name=$CHART_NAME"
          echo "manifest-dir=$MANIFEST_DIR"
          echo "branch-suffix=$BRANCH_SUFFIX"
          echo "version=$VERSION"
        } >> "$GITHUB_OUTPUT"
    - name: Hydrate
      # Renders Kubernetes manifests for the current chart and environment using
      # `helm template`.  All rendered files are written to a temporary
      # directory (`$RUNNER_TEMP/hydrated-manifests`) so that intermediate
      # state is never accidentally committed.
      #
      # Variables read from helm-config.yaml:
      #   releaseName  – Helm release name (required).
      #   namespace    – Kubernetes namespace (required).
      #   apis         – Comma-separated list of additional Kubernetes API
      #                  groups passed via `-a` to enable conditional rendering
      #                  of resources that depend on CRDs or optional APIs.
      #   valueFiles   – Comma-separated list of values files for the
      #                  current environment, passed via `-f`. The paths are
      #                  relative to the chart directory.
      #
      # helm template flags used:
      #   -a  (--api-versions)   Enable extra API groups for `Capabilities` checks.
      #   -f  (--values)         Merge environment-specific values files.
      #   -n  (--namespace)      Set the release namespace.
      #   --output-dir           Write each rendered manifest to a file instead
      #                          of stdout, preserving the chart directory layout.
      #   --include-crds         Include CRD manifests in the output.
      #   --release-name         Include the release name in the output-dir path.
      #   --skip-tests           Omit test hook manifests from the output.
      env:
        CHART_DIR: ${{ matrix.entry.chart }}
        HYDRATION: ${{ matrix.entry.env }}
      run: |
        set -euo pipefail
        CONFIG="$CHART_DIR/helm-config.yaml"
        RELEASE_NAME=$(yq 'explode(.) | .releaseName // ""' "$CONFIG")
        NAMESPACE=$(yq 'explode(.) | .namespace // ""' "$CONFIG")
        if [[ -z "$RELEASE_NAME" ]]; then
          echo "Error: releaseName is required in $CONFIG" >&2
          exit 1
        fi
        if [[ -z "$NAMESPACE" ]]; then
          echo "Error: namespace is required in $CONFIG" >&2
          exit 1
        fi
        APIS=$(hydration=$HYDRATION yq 'explode(.) | (.environments.[env(hydration)].apis // []) | @csv' "$CONFIG")
        # Value file paths are declared relative to the chart, so they are
        # prefixed with the chart directory before being handed to helm.
        VALUE_FILES=$(hydration=$HYDRATION chart_dir=$CHART_DIR yq 'explode(.) | (.environments.[env(hydration)].valueFiles // []) | map(env(chart_dir) + "/" + .) | @csv' "$CONFIG")
        HELM_ARGS=()
        if [[ -n "$APIS" ]]; then
          HELM_ARGS+=(-a "$APIS")
        fi
        if [[ -n "$VALUE_FILES" ]]; then
          HELM_ARGS+=(-f "$VALUE_FILES")
        fi
        # Render templates to a temporary directory to avoid committing
        # intermediate files before post-processing is complete.
        helm template "$RELEASE_NAME" "$CHART_DIR" \
          "${HELM_ARGS[@]}" \
          -n "$NAMESPACE" \
          --output-dir "${RUNNER_TEMP}/hydrated-manifests" \
          --include-crds \
          --release-name \
          --skip-tests
        # Post-process all rendered YAML manifests to inject ArgoCD annotations
        # required for reliable CRD management via server-side apply.
        #
        # Why server-side apply for CRDs?
        #   CRD manifests often carry large `last-applied-configuration` annotations
        #   that exceed the 256 KiB annotation size limit enforced by Kubernetes.
        #   Using ServerSideApply=true tells ArgoCD to apply them with server-side
        #   apply (SSA), which avoids storing the full manifest in annotations.
        #
        # Why sync-wave "-1"?
        #   Setting the sync-wave to -1 ensures CRDs are applied before all other
        #   resources (wave 0 and above), so that custom resources that depend on
        #   them are never applied before their CRD exists in the cluster.
        #
        # The yq expression handles three cases for each CRD manifest:
        #   1. No sync-options annotation at all → create it with "ServerSideApply=true".
        #   2. sync-options annotation exists but does not contain "ServerSideApply=" →
        #      append ",ServerSideApply=true" to the existing value.
        #   3. No sync-wave annotation → create it with "-1".
        #      (If sync-wave is already set it is left unchanged.)
        find "${RUNNER_TEMP}/hydrated-manifests" -type f \( -name "*.yaml" -o -name "*.yml" \) -exec yq -i '
          select(.kind == "CustomResourceDefinition" and
            .metadata.annotations["argocd.argoproj.io/sync-options"] == null)
            .metadata.annotations["argocd.argoproj.io/sync-options"] = "ServerSideApply=true" |
          select(.kind == "CustomResourceDefinition" and .metadata.annotations["argocd.argoproj.io/sync-options"] != null and
            (.metadata.annotations["argocd.argoproj.io/sync-options"] |
            contains("ServerSideApply=") | not))
            .metadata.annotations["argocd.argoproj.io/sync-options"] |= . + ",ServerSideApply=true" |
          select(.kind == "CustomResourceDefinition" and .metadata.annotations["argocd.argoproj.io/sync-wave"] == null)
            .metadata.annotations["argocd.argoproj.io/sync-wave"] = "-1"
        ' {} \;
    - name: Switch to the environment branch
      # The environment branch is guaranteed to exist by the
      # prepare-environment-branches job. The actions/checkout step only fetches
      # the default branch, so an explicit fetch is required before switching.
      if: ${{ inputs.create-pull-request }}
      env:
        BRANCH: environments/${{ matrix.entry.env }}
      run: |
        set -euo pipefail
        git fetch origin "$BRANCH"
        git switch "$BRANCH"
    - name: Collect manifests
      # Moves the rendered manifests from the temporary output directory into
      # the working directory.
      env:
        MANIFEST_DIR: ${{ steps.chart.outputs.manifest-dir }}
      run: |
        set -euo pipefail
        # Remove the output of a previous run for this chart only, so that
        # sibling charts sharing the branch keep their manifests.
        rm -rf "${MANIFEST_DIR:?}"
        mkdir -p "$MANIFEST_DIR"
        mv -v "${RUNNER_TEMP}/hydrated-manifests"/* "$MANIFEST_DIR/"
    - name: Stage manifests
      # Stages the rendered manifests so that peter-evans/create-pull-request
      # picks them up as the commit content for the hydration PR.
      if: ${{ inputs.create-pull-request }}
      env:
        MANIFEST_DIR: ${{ steps.chart.outputs.manifest-dir }}
      run: |
        set -euo pipefail
        git add "$MANIFEST_DIR"
        # Remove untracked files left behind by helm dependency build (e.g.
        # downloaded chart archives) so the working tree is clean before the PR
        # action runs. -f (force) is required because Git refuses to remove files
        # without it, -d extends this to directories. Staged manifests are kept.
        git clean -fd -e "$MANIFEST_DIR"
        # Prints the current git status to the job log for debugging purposes.
        # Useful for verifying which files were staged by `git add` and confirming
        # that the hydrated manifests are ready to be committed.
        git status
    - name: Upload hydrated manifests
      # Publishes the rendered manifests so that a calling workflow can inspect
      # or compare them without going through an environment branch.
      if: ${{ inputs.upload-artifact }}
      uses: actions/upload-artifact@v4
      with:
        name: hydrated-${{ steps.chart.outputs.name }}-${{ matrix.entry.env }}
        path: ${{ steps.chart.outputs.manifest-dir }}/
        if-no-files-found: error
    - name: Create pull request
      # Opens (or updates) one pull request per chart and environment with the
      # freshly rendered manifests.
      #
      # Condition:
      #   inputs.create-pull-request – Skips this step in render-only mode.
      #   if: ${{ !env.ACT }}  – Skips this step when the workflow is executed
      #                          locally with `act` (https://github.com/nektos/act).
      #                          The `ACT` environment variable is set automatically
      #                          by act, so the step only runs in real GitHub Actions
      #                          where a pull request can actually be opened.
      #
      # Parameters:
      #   base    – Target branch the PR merges into; one branch per environment.
      #   branch  – Source branch created/updated with the hydrated manifests.
      #             Includes the chart name when the repository holds several
      #             charts, and the subchart version so that each chart version
      #             gets its own branch and open PRs from different versions
      #             coexist.
      #   labels  – Labels applied to the PR for filtering and automation rules.
      #   title   – PR title, prefixed with the 💧 emoji for immediate recognition
      #             and including the subchart version for at-a-glance traceability
      #             in the pull-request list.
      if: ${{ inputs.create-pull-request && !env.ACT }}
      uses: peter-evans/create-pull-request@v8.1.1
      with:
        # Only include this chart's hydrated manifests in the PR, not any other
        # changes that may be present in the source branch.
        add-paths: |
          ${{ steps.chart.outputs.manifest-dir }}/
        # Target branch: one long-lived branch per environment holds the latest
        # hydrated state and is watched by the GitOps agent (e.g. ArgoCD).
        base: environments/${{ matrix.entry.env }}
        # Source branch: includes the subchart version so that parallel PRs for
        # different chart versions never overwrite each other's branch.
        branch: hydration-pull-request/${{ matrix.entry.env }}${{ steps.chart.outputs.branch-suffix }}-${{ steps.chart.outputs.version }}
        labels: |
          hydration
          automated pr
        title: 💧 [${{ matrix.entry.env }}] Hydrated manifests for ${{ steps.chart.outputs.name }} subchart version ${{ steps.chart.outputs.version }}
