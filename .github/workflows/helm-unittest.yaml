# Helm Unittest CI
#
# Runs Helm unit tests and linting for a Helm chart. Optionally sends
# MS Teams notifications on Renovate dependency-update branches to provide
# immediate feedback on whether an automated chart version bump is safe to merge.
#
# Purpose
# -------
# Catch rendering errors, misconfigured values, and broken templates as early
# as possible in the pull-request lifecycle, before any manifest reaches the
# cluster. Linting additionally enforces Helm best practices.
#
# Inputs
# ------
#   helm-version          – Helm CLI version to install. Pin to a specific
#                           version (e.g. "v3.19.0") for reproducible builds.
#                           Defaults to "latest".
#   helm-unittest-version – Version of the helm-unittest plugin to install
#                           (e.g. "1.0.3"). Defaults to "main" (latest).
#                           Pinning is recommended for reproducible builds.
#   charts-root           – Where to start looking for charts. Defaults to the
#                           repository root.
#   chart-discovery-depth – How deep below charts-root to look.
#   with-subchart         – Whether to also run the tests of charts under
#                           charts/. Defaults to true.
#
# Secrets
# -------
#   steadops-helm-renovation-ms-teams-webhook – MS Teams Workflows webhook URL
#     (created with the "Send webhook alerts to a channel" Workflows template,
#     shown as "Post to a channel when a webhook request is received" in some
#     tenants). Legacy Office 365 connector URLs no longer work.
#     Optional. Receives the success notifications, and also the failure
#     notifications when no error webhook is passed. Notifications are only
#     sent on branches starting with `renovate/`.
#   steadops-helm-renovation-ms-teams-error-webhook – MS Teams Workflows
#     webhook URL for failure notifications, e.g. of a dedicated error channel.
#     Optional. When passed, failures are sent here instead of to
#     steadops-helm-renovation-ms-teams-webhook. Notifications are skipped
#     entirely when neither secret is passed.
#
# Expected repository layout
# --------------------------
# Every directory holding both a Chart.yaml and a tests/ directory is tested.
# With the default inputs that is the repository root, which is the
# one-chart-per-repository layout. Repositories holding several charts point
# charts-root and chart-discovery-depth at the directory the charts live in.
#
#   Chart.yaml        – Required by `helm dependency update` and `helm lint`.
#   Chart.lock        – Should be committed. It pins the subchart versions
#                       that are tested, via `helm dependency build`. Without
#                       it the versions are resolved with
#                       `helm dependency update` and the workflow warns.
#   tests/            – Directory containing helm-unittest test files
#                       (*.yaml with `suite:` key). Required by `helm unittest`.

name: Helm unittest CI

on:
  workflow_call:
    inputs:
      helm-version:
        default: "latest"
        description: "Helm version eg v3.19.0, defaults to latest."
        type: string
      helm-unittest-version:
        default: "main"
        description: "Helm unittest plugin version eg 1.0.3, defaults to main (latest version)."
        type: string
      charts-root:
        default: "."
        description: "Directory to search for charts, defaults to the repository root."
        type: string
      chart-discovery-depth:
        default: 2
        description: "Maximum search depth for a chart's tests directory below charts-root."
        type: number
      with-subchart:
        default: true
        description: "Also run the tests of charts under charts/."
        type: boolean
    secrets:
      steadops-helm-renovation-ms-teams-webhook:
        required: false
      steadops-helm-renovation-ms-teams-error-webhook:
        required: false

jobs:
  # ---------------------------------------------------------------------------
  # Job: define-matrix
  # Finds every chart that has tests. A chart without a tests directory is
  # skipped rather than failing, so charts can adopt tests one at a time.
  # ---------------------------------------------------------------------------
  define-matrix:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.define.outputs.charts }}
    steps:
    - uses: actions/checkout@v7
    - name: Discover charts with tests
      id: define
      env:
        CHARTS_ROOT: ${{ inputs.charts-root }}
        DISCOVERY_DEPTH: ${{ inputs.chart-discovery-depth }}
      run: |
        set -euo pipefail
        charts=$(find "$CHARTS_ROOT" -maxdepth "$DISCOVERY_DEPTH" -type d -name tests -print0 \
          | while IFS= read -r -d '' dir; do
              chart="$(dirname "$dir")"
              if [ -f "$chart/Chart.yaml" ]; then
                printf '%s\n' "$chart"
              fi
            done | sort -u | jq -Rsc 'split("\n") | map(select(length > 0))')
        if [ "$charts" = "[]" ]; then
          echo "::error::No directory below '$CHARTS_ROOT' holds both a Chart.yaml and a tests directory."
          exit 1
        fi
        echo "charts=$charts" >> "$GITHUB_OUTPUT"

  unittest:
    runs-on: ubuntu-latest
    needs:
    - define-matrix
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.define-matrix.outputs.charts) }}
    env:
      # Mapped here so a step condition can tell whether the secret was passed;
      # the secrets context is not available in an `if` expression.
      MS_TEAMS_WEBHOOK: ${{ secrets.steadops-helm-renovation-ms-teams-webhook }}
      MS_TEAMS_ERROR_WEBHOOK: ${{ secrets.steadops-helm-renovation-ms-teams-error-webhook }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Helm
      # Installs the Helm CLI at the version requested via the workflow input.
      # Pinning to a specific version (e.g. "v3.19.0") ensures reproducible builds.
      uses: azure/setup-helm@v5.0.1
      with:
        version: ${{ inputs.helm-version }}
    - name: Install helm-unittest plugin
      # Installs the helm-unittest plugin at the requested version.
      # The script first checks whether the plugin is already installed at the
      # desired version to avoid unnecessary reinstalls on cached runners.
      # Helm v4 introduced a breaking change requiring --verify=false for
      # plugins installed from git URLs without a GPG signature; the Helm
      # major version is detected at runtime to handle both v3 and v4.
      run: |
        set -e
        PLUGIN_NAME="unittest"
        DESIRED_VERSION="${{ inputs.helm-unittest-version }}"
        PLUGIN_URL="https://github.com/helm-unittest/helm-unittest.git"
        INSTALLED_VERSION=$(helm plugin list | awk -v name="$PLUGIN_NAME" '$1 == name {print $2}')
        MAJOR_VERSION=$(helm version --short | grep -Eo 'v[0-9]+' | cut -d'v' -f2)
        MAJOR_VERSION=${MAJOR_VERSION:-3}
        if ! helm plugin list | grep -q "$PLUGIN_NAME" || [ "$INSTALLED_VERSION" != "$DESIRED_VERSION" ]; then
          if helm plugin list | grep -q "$PLUGIN_NAME"; then
            helm plugin uninstall "$PLUGIN_NAME"
          fi
          if [ "$MAJOR_VERSION" -ge 4 ]; then
            helm plugin install --verify=false --version "$DESIRED_VERSION" "$PLUGIN_URL"
          else
            helm plugin install --version "$DESIRED_VERSION" "$PLUGIN_URL"
          fi
        fi
    - name: Build Helm dependencies
      # Downloads all chart dependencies declared in Chart.yaml into charts/.
      # Must run before templating or testing to ensure all sub-charts are
      # present locally.
      env:
        CHART_DIR: ${{ matrix.chart }}
      run: |
        set -euo pipefail
        # `helm dependency build` resolves https repositories against the local
        # repository list rather than by URL, and a runner starts with none
        # registered. Every http(s) repository the chart declares is added
        # first. oci:// and file:// dependencies need no entry, and an alias
        # (`@name` or `alias:name`) refers to a repository that has to be
        # registered already, so both are left to Helm. explode(.) resolves the
        # anchors Chart.yaml commonly uses for the dependency name.
        while IFS=$'\t' read -r dep_name dep_url; do
          case "$dep_url" in
            http://*|https://*) ;;
            *) continue ;;
          esac
          helm repo add "$dep_name" "$dep_url" --force-update > /dev/null
        done < <(yq -N -r 'explode(.) | .dependencies[]? | [.name, .repository] | @tsv' "$CHART_DIR/Chart.yaml")
        if [ -f "$CHART_DIR/Chart.lock" ]; then
          # A committed lock file pins the tested subchart versions, so the
          # tests run against what the chart will actually ship. This fails
          # when Chart.lock and Chart.yaml disagree.
          helm dependency build "$CHART_DIR"
        else
          # Without a lock file the versions are resolved from the ranges in
          # Chart.yaml.
          echo "::warning::$CHART_DIR/Chart.lock is not committed, so the subchart versions are resolved now rather than by the repository, and an upstream release can change the tested chart without a commit. Run 'helm dependency update' and commit the lock file."
          helm dependency update "$CHART_DIR"
        fi
    - name: Run Helm unittests
      # Runs all helm-unittest test suites found in the chart.
      # -t JUnit  outputs results in JUnit XML format so they can be picked up
      #           by the Publish Test Results step below.
      # -o        writes the XML report to test-output.xml in the workspace.
      env:
        CHART_DIR: ${{ matrix.chart }}
        WITH_SUBCHART: ${{ inputs.with-subchart }}
      run: |
        helm unittest --with-subchart="$WITH_SUBCHART" \
          -t JUnit -o test-output.xml "$CHART_DIR"
    - name: Publish Test Results
      # Parses the JUnit XML report and publishes a test result summary to the
      # GitHub Actions UI (check run annotations and job summary).
      # Skipped when running locally with `act` (!env.ACT) since the GitHub
      # Checks API is unavailable outside of real GitHub Actions.
      # if: !cancelled() ensures results are published even when tests fail,
      # so the failure details are always visible in the PR.
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: ${{ !cancelled() && !env.ACT }}
      with:
        files: |
          test-output.xml
    - name: Lint Helm chart
      # Runs `helm lint` to validate chart structure, required fields, and
      # template syntax. Fails the job if any linting errors are found.
      env:
        CHART_DIR: ${{ matrix.chart }}
      run: helm lint "$CHART_DIR"
    - name: Notify MS Teams
      # Posts the result to MS Teams on Renovate branches, so the team can
      # approve automated dependency-update PRs with confidence, or is alerted
      # right away that an update broke the chart and must not be merged.
      # Successes go to the webhook, failures to the error webhook, falling back
      # to the webhook when no error webhook was passed. Only runs on branches
      # starting with `renovate/`, when a webhook for the job status was
      # passed, and not when using `act`. On pull requests github.ref is
      # refs/pull/<number>/merge, so the branch is taken from github.head_ref,
      # falling back to github.ref_name on push.
      # Referenced with its full path: a local path would resolve against the
      # checkout of the calling repository.
      if: ${{ startsWith(github.head_ref || github.ref_name, 'renovate/') && !env.ACT && ((success() && env.MS_TEAMS_WEBHOOK != '') || (failure() && (env.MS_TEAMS_ERROR_WEBHOOK != '' || env.MS_TEAMS_WEBHOOK != ''))) }}
      uses: steadforce/steadops-workflows/.github/actions/teams-notification@v4.1.0
      with:
        webhook-url: ${{ job.status == 'success' && env.MS_TEAMS_WEBHOOK || env.MS_TEAMS_ERROR_WEBHOOK || env.MS_TEAMS_WEBHOOK }}
        status: ${{ job.status }}
        title: ${{ job.status == 'success' && '✅ Helm validation and helm unittests succeeded!' || '🚢 Helm validation or helm unittests failed!!!' }}
        facts: |
          Chart=${{ matrix.chart }}
