---
# Source: service-a/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-a-umbrella
  namespace: service-a
data:
  owner: platform
  # Formatting yq would rewrite, which the hydration has to keep as Helm renders it.
  aligned:    value
  expression: >-
    sum by (job) (
      rate(errors_total[5m])
    ) > 0
